services:
  - type: web
    name: redtape-api
    env: python
    region: frankfurt
    plan: free

    # Build from repo source (monorepo): install the API package
    buildCommand: cd apps/api && pip install -e .

    # Render provides $PORT at runtime for the service listener.
    # Migrates and seeds on every start (see apps/api/scripts/start.sh): Render's free
    # plan ignores `preDeployCommand` and offers no shell, so this is the only hook.
    startCommand: cd apps/api && sh scripts/start.sh

    # Health endpoint used by Render + GitHub keep-alive.
    healthCheckPath: /health

    # NOTE: Supabase credentials are stored in Render "Environment" variables
    # (recommended). These can also be set via Render UI or secrets.
    envVars:
      - key: ENVIRONMENT
        value: production

      # CORS: allow the actual deployed frontend origin. Cloudflare served this
      # project under a workers.dev domain rather than the pages.dev domain
      # originally assumed here — update this if the frontend's origin changes.
      # Keep localhost entries for local dev as well.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://redtape-web.vadim-schultz.workers.dev

      # DATABASE_URL is required and should be set in the Render dashboard.
      # It is intentionally omitted here to avoid committing secrets.
