name: Platform maintenance

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        type: choice
        default: all
        options:
          - all
          - openplz
          - discovery
  schedule:
    # Monthly, day 28 at 02:00 UTC (day 28 exists in every month); see docs/operations/scheduled-jobs.md
    - cron: "0 2 28 * *"

permissions:
  contents: read

jobs:
  openplz:
    name: Import OpenPLZ Germany locations
    if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'openplz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply database migrations
        run: |
          cd apps/api
          alembic upgrade head

      - name: Verify OpenPLZ migration constraint exists
        run: |
          cd apps/api
          python -c "from sqlalchemy import inspect; from app.db import engine; insp = inspect(engine); indexes = insp.get_indexes('jurisdiction'); assert any(i.get('name') == 'uq_jurisdiction_kind_code' for i in indexes), 'Missing unique index uq_jurisdiction_kind_code'"

      - name: Import OpenPLZ locations (de)
        run: |
          cd apps/api
          python scripts/import_openplz_locations.py --language de

  discovery:
    name: Discovery online (catalogue ingest)
    needs: openplz
    # Runs even when openplz failed or was skipped.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'discovery') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shares the group with discovery-drain.yml so two drains never overlap.
    concurrency:
      group: discovery-drain
      cancel-in-progress: false
    env:
      DISCOVERY_API_URL: ${{ secrets.DISCOVERY_API_URL }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      FEDERAL_JURISDICTION_ID: ${{ secrets.FEDERAL_JURISDICTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery ingest
        run: |
          cd apps/discovery-ingest
          python -m pip install --upgrade pip
          pip install -e .

      - name: Wait for Render API health
        run: |
          python -c "from discovery_ingest.health import wait_for_api; wait_for_api('${DISCOVERY_API_URL}')"

      - name: GovData OZG catalogue fetch
        run: |
          set -euo pipefail
          python -m discovery_ingest govdata fetch \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages 15 \
            --page-size 100

      - name: PVOG Suchdienst catalogue run
        run: |
          set -euo pipefail
          python -m discovery_ingest pvog run \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages 50
