name: Platform maintenance

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Force job (default: calendar router)"
        required: false
        type: choice
        options:
          - openplz
          - discovery
          - skip
  schedule:
    # Daily 02:00 UTC — 6-day OpenPLZ / discovery cycle (see docs/operations/scheduled-jobs.md)
    - cron: "0 2 * * *"

env:
  MAINTENANCE_ANCHOR_DATE: "2026-01-01"

jobs:
  route:
    name: Resolve maintenance job
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.router.outputs.job }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve job from calendar or dispatch input
        id: router
        env:
          DISPATCH_JOB: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail
          args=(--anchor "${MAINTENANCE_ANCHOR_DATE}")
          if [ -n "${DISPATCH_JOB:-}" ]; then
            args+=(--dispatch-job "${DISPATCH_JOB}")
          fi
          job="$(python scripts/maintenance_job_router.py "${args[@]}")"
          echo "job=${job}" >> "${GITHUB_OUTPUT}"

  openplz:
    name: Import OpenPLZ Germany locations
    needs: route
    if: needs.route.outputs.job == 'openplz'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply database migrations
        run: |
          cd apps/api
          alembic upgrade head

      - name: Verify OpenPLZ migration constraint exists
        run: |
          cd apps/api
          python -c "from sqlalchemy import inspect; from app.db import engine; insp = inspect(engine); indexes = insp.get_indexes('jurisdiction'); assert any(i.get('name') == 'uq_jurisdiction_kind_code' for i in indexes), 'Missing unique index uq_jurisdiction_kind_code'"

      - name: Import OpenPLZ locations (de)
        run: |
          cd apps/api
          python scripts/import_openplz_locations.py --language de

  discovery:
    name: Discovery online (catalogue ingest)
    needs: route
    if: needs.route.outputs.job == 'discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISCOVERY_API_URL: ${{ secrets.DISCOVERY_API_URL }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      FEDERAL_JURISDICTION_ID: ${{ secrets.FEDERAL_JURISDICTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery ingest
        run: |
          cd apps/discovery-ingest
          python -m pip install --upgrade pip
          pip install -e .

      - name: Wait for Render API health
        run: |
          python -c "from discovery_ingest.health import wait_for_api; wait_for_api('${DISCOVERY_API_URL}')"

      - name: GovData OZG catalogue fetch
        run: |
          set -euo pipefail
          python -m discovery_ingest govdata fetch \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages 15 \
            --page-size 100

      - name: PVOG Suchdienst catalogue run
        run: |
          set -euo pipefail
          python -m discovery_ingest pvog run \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages 50

      - name: Discovery worker drain
        run: |
          set -euo pipefail
          python -m discovery_ingest worker drain --max-tasks 50

  skip:
    name: No maintenance job today
    needs: route
    if: needs.route.outputs.job == 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Skip (success)
        run: echo "No OpenPLZ or discovery job scheduled for this cycle day."
