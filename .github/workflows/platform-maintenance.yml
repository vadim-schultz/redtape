name: Platform maintenance

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (the catalogue ingest runs weekly in discovery-catalogue.yml)"
        required: false
        type: choice
        default: all
        options:
          - all
          - openplz
  schedule:
    # Monthly, day 28 at 02:00 UTC (day 28 exists in every month); see docs/operations/scheduled-jobs.md
    - cron: "0 2 28 * *"

permissions:
  contents: read

jobs:
  openplz:
    name: Import OpenPLZ Germany locations
    if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'openplz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply database migrations
        run: |
          cd apps/api
          alembic upgrade head

      - name: Verify OpenPLZ migration constraint exists
        run: |
          cd apps/api
          python -c "from sqlalchemy import inspect; from app.db import engine; insp = inspect(engine); indexes = insp.get_indexes('jurisdiction'); assert any(i.get('name') == 'uq_jurisdiction_kind_code' for i in indexes), 'Missing unique index uq_jurisdiction_kind_code'"

      - name: Import OpenPLZ locations (de)
        run: |
          cd apps/api
          python scripts/import_openplz_locations.py --language de
