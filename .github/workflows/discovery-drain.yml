name: Discovery drain

on:
  schedule:
    # Daily 04:00 UTC. Runs only when the repository variable
    # DISCOVERY_DRAIN_SCHEDULE equals "enabled" (see the job condition).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Maximum tasks per claim request (1-50)"
        required: false
        default: "50"
        type: string
      max_batches:
        description: "Maximum claim/process batches"
        required: false
        default: "20"
        type: string
      time_budget_seconds:
        description: "Wall-clock budget in seconds (empty uses DISCOVERY_DRAIN_BUDGET_SECONDS, else 900)"
        required: false
        default: ""
        type: string
      kinds:
        description: "Comma separated task kinds to claim"
        required: false
        default: "fetch_url,enrich_metadata,harvest_payload"
        type: string

permissions:
  contents: read

concurrency:
  group: discovery-drain
  cancel-in-progress: false

jobs:
  drain:
    name: Drain discovery tasks
    if: github.event_name == 'workflow_dispatch' || vars.DISCOVERY_DRAIN_SCHEDULE == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCOVERY_API_URL: ${{ secrets.DISCOVERY_API_URL }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      MAX_TASKS: ${{ inputs.max_tasks || '50' }}
      MAX_BATCHES: ${{ inputs.max_batches || '20' }}
      TIME_BUDGET_SECONDS: ${{ inputs.time_budget_seconds || vars.DISCOVERY_DRAIN_BUDGET_SECONDS || '900' }}
      TASK_KINDS: ${{ inputs.kinds || 'fetch_url,enrich_metadata,harvest_payload' }}
    steps:
      - name: Record the job start time
        run: echo "DRAIN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/discovery-ingest/pyproject.toml

      - name: Install discovery ingest
        working-directory: apps/discovery-ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check the Actions minutes budget
        id: budget
        run: |
          # Exit 3 means the ledger has fewer minutes left than this job may use (timeout-minutes);
          # skip the drain without failing the run. An unreachable ledger lets the drain run.
          code=0
          python -m discovery_ingest budget show --resource actions_minutes --require-remaining actions_minutes=45 || code=$?
          if [ "${code}" -eq 3 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "### Discovery drain skipped: the Actions minutes budget is used up" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          exit "${code}"

      - name: Wait for Render API health
        if: steps.budget.outputs.skip != 'true'
        run: |
          python -c "import os; from discovery_ingest.health import wait_for_api; wait_for_api(os.environ['DISCOVERY_API_URL'])"

      - name: Drain worker tasks
        if: steps.budget.outputs.skip != 'true'
        run: |
          set -euo pipefail
          args=(
            --max-tasks "${MAX_TASKS}"
            --max-batches "${MAX_BATCHES}"
            --time-budget-seconds "${TIME_BUDGET_SECONDS}"
            --kinds "${TASK_KINDS}"
          )
          python -m discovery_ingest worker drain "${args[@]}" | tee drain-report.json

      - name: Write drain report to job summary
        if: always() && steps.budget.outputs.skip != 'true'
        run: |
          if [ -s drain-report.json ]; then
            {
              echo "### Discovery drain report"
              echo
              echo '```json'
              cat drain-report.json
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Discovery drain report" >> "${GITHUB_STEP_SUMMARY}"
            echo "No report was produced; see the drain step log." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Fail the job when the drain did not succeed
        if: steps.budget.outputs.skip != 'true'
        run: |
          python -c "import json,sys; sys.exit(0 if json.load(open('drain-report.json')).get('succeeded') else 1)"

      - name: Report Actions minutes to the budget ledger
        if: always()
        continue-on-error: true
        run: |
          # Whole minutes since the first step, rounded up, plus one for runner setup and rounding.
          started="${DRAIN_STARTED_AT:-$(date +%s)}"
          elapsed=$(( $(date +%s) - started ))
          minutes=$(( (elapsed + 59) / 60 + 1 ))
          python -m discovery_ingest budget report-minutes --minutes "${minutes}"
