name: API Lint & Test

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint-test.yml"
      - ".github/actions/setup-api-python/**"
  pull_request:
    # ready_for_review starts CI when a draft is marked ready; drafts run nothing.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint-test.yml"
      - ".github/actions/setup-api-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/api

jobs:
  # Reports whether the change set touches the migrations; each job rounds up to
  # a whole billed minute, so this job is kept to one checkout and one script.
  change-set:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: detect
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          # HEAD is the merge commit on pull requests, so this diff is the PR's own changes.
          # A new branch, or a base that a force-push removed, has no commit to diff
          # against: run the round trip then.
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "$base" HEAD | python3 scripts/ci_change_set.py
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/redtape
      REQUIRE_DB: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redtape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redtape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up API Python
        uses: ./.github/actions/setup-api-python

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

      - name: Mypy type check
        run: mypy app scripts

      - name: Pytest
        run: pytest

  migrations:
    needs: change-set
    if: needs.change-set.outputs.migrations == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/redtape_migrations

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redtape_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redtape_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up API Python
        uses: ./.github/actions/setup-api-python

      - name: Migration round trip
        run: bash scripts/check_migrations.sh
