name: API Lint & Test

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint-test.yml"
      - ".github/actions/setup-api-python/**"
  pull_request:
    # ready_for_review starts CI when a draft is marked ready; drafts run nothing.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-lint-test.yml"
      - ".github/actions/setup-api-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/api

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/redtape
      REQUIRE_DB: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redtape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redtape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up API Python
        uses: ./.github/actions/setup-api-python

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

      - name: Mypy type check
        run: mypy app scripts

      - name: Pytest
        run: pytest

  migrations:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/redtape_migrations

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redtape_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redtape_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up API Python
        uses: ./.github/actions/setup-api-python

      - name: Migration round trip
        run: bash scripts/check_migrations.sh
