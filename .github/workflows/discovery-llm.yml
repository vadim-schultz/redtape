name: Discovery llm

on:
  schedule:
    # Daily 04:30 UTC. Runs only when the repository variable DISCOVERY_LLM_SCHEDULE equals "enabled" (see the job
    # condition), and then takes the model from the repository variable DISCOVERY_LLM_MODEL.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      llm_model:
        description: "Workers AI model id to extract with (the default is the provisional choice for decision X16)"
        required: false
        default: "@cf/qwen/qwen3-30b-a3b-fp8"
        type: string
      max_tasks:
        description: "Maximum tasks per claim request (small: a limit releases every task of the batch)"
        required: false
        default: "5"
        type: string
      max_batches:
        description: "Maximum claim/process batches"
        required: false
        default: "20"
        type: string
      time_budget_seconds:
        description: "Wall-clock budget in seconds"
        required: false
        default: "600"
        type: string
      neuron_budget:
        description: "Workers AI neurons this run may spend (a long page reserves up to about 900; the day allows 9500)"
        required: false
        default: "2500"
        type: string
      kinds:
        description: "Comma separated task kinds to claim"
        required: false
        default: "llm_extract"
        type: string

permissions:
  contents: read

# The same group as the rest of the discovery pipeline: scheduled drains never overlap.
concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  drain:
    name: Drain llm_extract tasks
    if: github.event_name == 'workflow_dispatch' || vars.DISCOVERY_LLM_SCHEDULE == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCOVERY_API_URL: ${{ secrets.DISCOVERY_API_URL }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      LLM_MODEL: ${{ inputs.llm_model || vars.DISCOVERY_LLM_MODEL }}
      MAX_TASKS: ${{ inputs.max_tasks || '5' }}
      MAX_BATCHES: ${{ inputs.max_batches || '20' }}
      TIME_BUDGET_SECONDS: ${{ inputs.time_budget_seconds || '600' }}
      NEURON_BUDGET: ${{ inputs.neuron_budget || '2500' }}
      TASK_KINDS: ${{ inputs.kinds || 'llm_extract' }}
    steps:
      - name: Record the job start time
        run: echo "DRAIN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/discovery-ingest/pyproject.toml

      - name: Install discovery ingest
        working-directory: apps/discovery-ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check the model, the Actions minutes and the neurons budgets
        id: budget
        run: |
          # No model: skip without failing (a scheduled run takes it from the repository variable DISCOVERY_LLM_MODEL).
          if [ -z "${LLM_MODEL}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "### Discovery llm skipped: no model (pass llm_model, or set the repository variable DISCOVERY_LLM_MODEL)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # Exit 3 means the ledger has fewer Actions minutes than this job may use (timeout-minutes) or fewer than
          # 300 neurons left today (a short page reserves about 200); skip the drain without failing the run. An
          # unreachable ledger lets the drain run, and the drain itself refuses to start without a readable ledger.
          code=0
          python -m discovery_ingest budget show --resource actions_minutes --resource neurons --require-remaining actions_minutes=20 --require-remaining neurons=300 || code=$?
          if [ "${code}" -eq 3 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "### Discovery llm skipped: the Actions minutes or the neurons are used up" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          exit "${code}"

      - name: Wait for Render API health
        if: steps.budget.outputs.skip != 'true'
        run: |
          python -c "import os; from discovery_ingest.health import wait_for_api; wait_for_api(os.environ['DISCOVERY_API_URL'])"

      - name: Drain llm_extract tasks
        if: steps.budget.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m discovery_ingest worker drain --max-tasks "${MAX_TASKS}" --max-batches "${MAX_BATCHES}" --time-budget-seconds "${TIME_BUDGET_SECONDS}" --neuron-budget "${NEURON_BUDGET}" --kinds "${TASK_KINDS}" | tee drain-report.json

      - name: Write drain report to job summary
        if: always() && steps.budget.outputs.skip != 'true'
        run: |
          if [ -s drain-report.json ]; then
            {
              echo "### Discovery llm report"
              echo
              echo '```json'
              cat drain-report.json
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Discovery llm report" >> "${GITHUB_STEP_SUMMARY}"
            echo "No report was produced; see the drain step log." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Fail the job when the drain did not succeed
        if: steps.budget.outputs.skip != 'true'
        run: |
          # llm_budget, llm_quota, db_limit, time_budget, batch_limit and queue_empty all succeed; only an
          # infrastructure error (a rejected token, an API failure) sets succeeded to false.
          python -c "import json,sys; sys.exit(0 if json.load(open('drain-report.json')).get('succeeded') else 1)"

      - name: Report Actions minutes to the budget ledger
        if: always()
        continue-on-error: true
        run: |
          # Whole minutes since the first step, rounded up, plus one for runner setup and rounding.
          started="${DRAIN_STARTED_AT:-$(date +%s)}"
          elapsed=$(( $(date +%s) - started ))
          minutes=$(( (elapsed + 59) / 60 + 1 ))
          python -m discovery_ingest budget report-minutes --minutes "${minutes}"
