name: OpenPLZ Import

on:
  workflow_dispatch:
  schedule:
    # Daily at 2 AM UTC (keeps Supabase free tier alive)
    - cron: "0 2 * * *"

jobs:
  import:
    name: Import OpenPLZ Germany locations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify migrations are current
        run: |
          cd apps/api
          alembic current

      - name: Import OpenPLZ locations (de)
        run: |
          cd apps/api
          python scripts/import_openplz_locations.py --language de

