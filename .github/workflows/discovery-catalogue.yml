name: Discovery catalogue

on:
  schedule:
    # Weekly, Sunday 03:30 UTC: the GovData and PVOG catalogue ingest, ahead of the drains that work through it. GitHub's
    # cron runs late in practice, so the time is a window. Scheduled runs use the default branch only.
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# The same group as the rest of the discovery pipeline: a scheduled ingest never overlaps a drain, and never cancels one.
concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  catalogue:
    name: Ingest the catalogue (GovData and PVOG)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DISCOVERY_API_URL: ${{ secrets.DISCOVERY_API_URL }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      FEDERAL_JURISDICTION_ID: ${{ secrets.FEDERAL_JURISDICTION_ID }}
      # Page caps per source. The defaults are the values the production runbook names; set the variables to change them.
      GOVDATA_MAX_PAGES: ${{ vars.CATALOGUE_GOVDATA_MAX_PAGES || '150' }}
      PVOG_MAX_PAGES: ${{ vars.CATALOGUE_PVOG_MAX_PAGES || '50' }}
      # Stale portal pages re-fetched this run, through the same enqueue as a new page. The bound never exceeds the smaller
      # page cap above. 0, the default, turns the refresh off.
      REFRESH_MAX_ROWS: ${{ vars.CATALOGUE_REFRESH_MAX_ROWS || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery ingest
        run: |
          cd apps/discovery-ingest
          python -m pip install --upgrade pip
          pip install -e .

      - name: Wait for Render API health
        run: |
          python -c "from discovery_ingest.health import wait_for_api; wait_for_api('${DISCOVERY_API_URL}')"

      - name: GovData OZG catalogue fetch
        run: |
          set -euo pipefail
          python -m discovery_ingest govdata fetch \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages "${GOVDATA_MAX_PAGES}" \
            --page-size 100

      - name: PVOG Suchdienst catalogue run
        run: |
          set -euo pipefail
          python -m discovery_ingest pvog run \
            --jurisdiction-id "${FEDERAL_JURISDICTION_ID}" \
            --max-pages "${PVOG_MAX_PAGES}"

      - name: Re-fetch stale catalogue pages (bounded)
        run: |
          set -euo pipefail
          python -m discovery_ingest catalogue refresh \
            --max-rows "${REFRESH_MAX_ROWS}" \
            --govdata-max-pages "${GOVDATA_MAX_PAGES}" \
            --pvog-max-pages "${PVOG_MAX_PAGES}"
