name: Discovery ingest CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/discovery-ingest/**"
      - ".github/workflows/discovery-ingest-ci.yml"
  pull_request:
    paths:
      - "apps/discovery-ingest/**"
      - ".github/workflows/discovery-ingest-ci.yml"

defaults:
  run:
    working-directory: apps/discovery-ingest

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/discovery-ingest/pyproject.toml

      - name: Install ingest + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

      - name: Mypy type check
        run: mypy discovery_ingest

      - name: Pytest
        run: python -m pytest
