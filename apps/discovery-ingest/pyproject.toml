[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redtape-discovery-ingest"
version = "0.1.0"
description = "Discovery catalogue ingest CLIs (GovData, PVOG, enrich)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.0,<3",
    "selectolax>=1.0.2",
    "typer>=0.12,<0.29",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "pyyaml>=6,<7",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["discovery_ingest*"]

[tool.setuptools.package-data]
discovery_ingest = ["translation/glossary_data/*.json", "i18n/data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["discovery_ingest", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "ANN401", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Use a Pydantic model, a TypedDict or pydantic.JsonValue instead of Any (see .plans/codebase-audit/00-audit-report.md section 5)." }
"typing_extensions.Any" = { msg = "Use a Pydantic model, a TypedDict or pydantic.JsonValue instead of Any (see .plans/codebase-audit/00-audit-report.md section 5)." }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN401", "TID251"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
strict_optional = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
