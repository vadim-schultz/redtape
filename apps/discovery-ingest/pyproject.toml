[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redtape-discovery-ingest"
version = "0.1.0"
description = "Discovery catalogue ingest CLIs (GovData, PVOG, enrich)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.0,<3",
    "selectolax>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "pyyaml>=6,<7",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["discovery_ingest*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["discovery_ingest", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "ANN401", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Use a Pydantic model, a TypedDict or pydantic.JsonValue instead of Any (see .plans/codebase-audit/00-audit-report.md section 5)." }
"typing_extensions.Any" = { msg = "Use a Pydantic model, a TypedDict or pydantic.JsonValue instead of Any (see .plans/codebase-audit/00-audit-report.md section 5)." }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN401", "TID251"]
# Any gate baseline (T2): delete the line when the removing chapter lands
"discovery_ingest/pvog/client.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/govdata/client.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/govdata/ckan.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/enrich.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/extract/llm/schema_prep.py" = ["ANN401", "TID251"]  # T2 baseline, removed by I2
"discovery_ingest/extract/llm/schema.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/extract/llm/payloads.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/extract/llm/cloudflare.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/extract/llm/client.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/fim/client.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/leika/client.py" = ["TID251"]  # T2 baseline, removed by I2
"discovery_ingest/worker/enrich_metadata.py" = ["TID251"]  # T2 baseline, removed by I3
"discovery_ingest/cli.py" = ["TID251"]  # T2 baseline, removed by I4
"discovery_ingest/capture_requeue.py" = ["TID251"]  # T2 baseline, removed by I4
# docstring baseline (T1): delete the line when its slice is done
"discovery_ingest/worker/**" = ["D107", "D401"]  # I-S1
"discovery_ingest/{emit_models,config,curation,enrich,curation_plan,health,curation_check,llm_settings,__init__,edges,budget_models,batch_dedup,schemas,mentions,catalogue_export,__main__,curation_load}.py" = ["D107", "D401"]  # I-S2 (browser/** has no current violations, so it carries no exemption)
"discovery_ingest/extract/{clean,clean_dom,registry,__init__,clean_meta,clean_rank,clean_cap,clean_links,clean_tags,clean_markdown,decode,base}.py" = ["D107", "D401"]  # I-S2
"discovery_ingest/extract/llm/**" = ["D103", "D107", "D205", "D400", "D401"]  # I-S3
"discovery_ingest/pvog/**" = ["D103", "D107", "D205", "D400", "D401"]  # I-S3
"discovery_ingest/govdata/**" = ["D103", "D107", "D205", "D400", "D401"]  # I-S3
"discovery_ingest/fim/**" = ["D103", "D107", "D205", "D400", "D401"]  # I-S3
"discovery_ingest/leika/**" = ["D103", "D107", "D205", "D400", "D401"]  # I-S3 (harvest/** has no current violations, so it carries no exemption)

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
strict_optional = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["httpx.*"]
ignore_missing_imports = true

# Any gate baseline (T2): one block per removing chapter; delete the whole
# block when that chapter lands (see .plans/codebase-audit/00-audit-report.md
# section 5).
[[tool.mypy.overrides]]
module = [
    "discovery_ingest.pvog.client",
    "discovery_ingest.govdata.client",
    "discovery_ingest.govdata.ckan",
    "discovery_ingest.enrich",
    "discovery_ingest.extract.llm.schema_prep",
    "discovery_ingest.extract.llm.schema",
    "discovery_ingest.extract.llm.payloads",
    "discovery_ingest.extract.llm.cloudflare",
    "discovery_ingest.extract.llm.client",
    "discovery_ingest.fim.client",
    "discovery_ingest.leika.client",
]
disallow_any_explicit = false  # T2 baseline, removed by I2

[[tool.mypy.overrides]]
module = ["discovery_ingest.worker.enrich_metadata"]
disallow_any_explicit = false  # T2 baseline, removed by I3

[[tool.mypy.overrides]]
module = ["discovery_ingest.cli", "discovery_ingest.capture_requeue"]
disallow_any_explicit = false  # T2 baseline, removed by I4

[tool.pytest.ini_options]
testpaths = ["tests"]
