[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redtape-api"
version = "0.1.0"
description = "RedTape Litestar API (Wave 0: i18n + skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
redtape-api = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
